<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111111">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <title>LC ShortLinks</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f5f7;
      color: #111;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .app {
      width: 100%;
      max-width: 500px;
      background: white;
      border-radius: 28px;
      padding: 30px 22px;
      box-shadow: 0 10px 40px rgba(0,0,0,.10);
    }

    .logo {
      width: 80px;
      height: 80px;
      border-radius: 20px;
      background: #111;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      font-weight: 800;
      margin: 0 auto 18px;
    }

    h1 {
      text-align: center;
      margin: 0;
      font-size: 30px;
    }

    .subtitle {
      text-align: center;
      color: #777;
      margin: 8px 0 28px;
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      padding: 16px;
      border: 1px solid #ddd;
      border-radius: 14px;
      font-size: 16px;
      outline: none;
      margin-bottom: 18px;
    }

    input:focus {
      border-color: #111;
    }

    button {
      width: 100%;
      margin-top: 0;
      padding: 16px;
      border: 0;
      border-radius: 14px;
      background: #111;
      color: white;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
    }

    .result {
      display: none;
      margin-top: 24px;
      padding: 18px;
      background: #f5f5f7;
      border-radius: 16px;
    }

    .short-url {
      word-break: break-all;
      font-weight: 600;
      margin: 10px 0;
    }

    .copy {
      background: white;
      color: #111;
      border: 1px solid #ddd;
      margin-top: 10px;
    }

    .status {
      text-align: center;
      margin-top: 15px;
      color: #777;
      min-height: 20px;
    }

    .hint {
      color: #888;
      font-size: 13px;
      margin-top: -10px;
      margin-bottom: 18px;
    }
  </style>
</head>

<body>

<main class="app">

  <div class="logo">LC</div>

  <h1>LC ShortLinks</h1>

  <p class="subtitle">
    Crea enlaces cortos personalizados
  </p>

  <label for="url">Enlace original</label>

  <input
    id="url"
    type="url"
    placeholder="https://youtube.com/..."
    autocomplete="off"
  >

  <label for="code">Nombre de tu enlace</label>

  <input
    id="code"
    type="text"
    placeholder="tunombre"
    autocomplete="off"
    maxlength="30"
  >

  <div class="hint">
    Solo letras, números, guiones y guion bajo.
  </div>

  <button onclick="acortar()">
    Crear enlace LC
  </button>

  <div id="result" class="result">

    <strong>Tu enlace corto:</strong>

    <div id="shortUrl" class="short-url"></div>

    <button class="copy" onclick="copiar()">
      📋 Copiar enlace
    </button>

    <button class="copy" onclick="compartir()">
      📤 Compartir
    </button>

  </div>

  <div id="status" class="status"></div>

</main>

<script>

const SUPABASE_URL =
"https://tfwepffzhuyppsavmoqw.supabase.co";

const SUPABASE_KEY =
"sb_publishable_4DOmAEAQ5tQv8U5zGgMHLg_m8u6N06J";


async function acortar() {

  const urlInput = document.getElementById("url");
  const codeInput = document.getElementById("code");
  const status = document.getElementById("status");
  const result = document.getElementById("result");

  const originalUrl = urlInput.value.trim();

  let code = codeInput.value.trim().toLowerCase();

  if (!originalUrl) {
    status.textContent = "Pega primero un enlace.";
    return;
  }

  if (!code) {
    status.textContent = "Escribe el nombre de tu enlace.";
    return;
  }

  try {
    new URL(originalUrl);
  } catch {
    status.textContent = "El enlace original no parece válido.";
    return;
  }

  if (!/^[a-z0-9_-]+$/.test(code)) {
    status.textContent =
      "Usa solamente letras, números, guiones y guion bajo.";
    return;
  }

  status.textContent = "Creando enlace LC...";
  result.style.display = "none";

  try {

    /* Comprobar si el nombre ya existe */

    const checkResponse = await fetch(
      `${SUPABASE_URL}/rest/v1/Links?code=eq.${encodeURIComponent(code)}&select=code`,
      {
        method: "GET",
        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization": `Bearer ${SUPABASE_KEY}`
        }
      }
    );

    if (!checkResponse.ok) {
      status.textContent =
        "No se pudo comprobar el nombre.";
      return;
    }

    const existentes = await checkResponse.json();

    if (existentes.length > 0) {
      status.textContent =
        "Ese nombre ya está ocupado. Elige otro.";
      return;
    }


    /* Guardar el enlace */

    const response = await fetch(
      `${SUPABASE_URL}/rest/v1/Links`,
      {
        method: "POST",

        headers: {
          "Content-Type": "application/json",
          "apikey": SUPABASE_KEY,
          "Authorization": `Bearer ${SUPABASE_KEY}`,
          "Prefer": "return=representation"
        },

        body: JSON.stringify({
          code: code,
          original_url: originalUrl
        })
      }
    );

    if (!response.ok) {

      const error = await response.text();

      console.error(error);

      status.textContent =
        "No se pudo crear el enlace.";

      return;
    }


    /* Dirección corta */

    const shortUrl =
      `${window.location.origin}${window.location.pathname}${code}`;

    document.getElementById("shortUrl").textContent =
      shortUrl;

    result.style.display = "block";

    status.textContent =
      "¡Enlace LC creado correctamente!";

  } catch (error) {

    console.error(error);

    status.textContent =
      "Error de conexión con Supabase.";

  }
}


function copiar() {

  const url =
    document.getElementById("shortUrl").textContent;

  navigator.clipboard.writeText(url);

  document.getElementById("status").textContent =
    "Enlace copiado.";

}


async function compartir() {

  const url =
    document.getElementById("shortUrl").textContent;

  if (navigator.share) {

    try {

      await navigator.share({
        title: "LC ShortLinks",
        url: url
      });

    } catch (error) {

      console.log(error);

    }

  } else {

    copiar();

  }

}

</script>

</body>
</html>
