<script>

const SUPABASE_URL =
"https://tfwepffzhuyppsavmoqw.supabase.co";

const SUPABASE_KEY =
"sb_publishable_4DOmAEAQ5tQv8U5zGgMHLg_m8u6N06J";


async function acortar() {

  const urlInput =
    document.getElementById("url");

  const codeInput =
    document.getElementById("code");

  const status =
    document.getElementById("status");

  const result =
    document.getElementById("result");

  const originalUrl =
    urlInput.value.trim();

  let code =
    codeInput.value.trim().toLowerCase();


  if (!originalUrl) {
    status.textContent =
      "Pega primero un enlace.";
    return;
  }


  if (!code) {
    status.textContent =
      "Escribe el nombre de tu enlace.";
    return;
  }


  try {
    new URL(originalUrl);
  } catch {
    status.textContent =
      "El enlace original no parece válido.";
    return;
  }


  if (!/^[a-z0-9_-]+$/.test(code)) {
    status.textContent =
      "Usa solamente letras, números, guiones y guion bajo.";
    return;
  }


  status.textContent =
    "Creando enlace LC...";

  result.style.display =
    "none";


  try {

    const checkResponse =
      await fetch(
        `${SUPABASE_URL}/rest/v1/Links?code=eq.${encodeURIComponent(code)}&select=code`,
        {
          method: "GET",

          headers: {
            "apikey": SUPABASE_KEY,
            "Authorization": `Bearer ${SUPABASE_KEY}`
          }
        }
      );


    if (!checkResponse.ok) {
      status.textContent =
        "No se pudo comprobar el nombre.";
      return;
    }


    const existentes =
      await checkResponse.json();


    if (existentes.length > 0) {
      status.textContent =
        "Ese nombre ya está ocupado. Elige otro.";
      return;
    }


    const response =
      await fetch(
        `${SUPABASE_URL}/rest/v1/Links`,
        {
          method: "POST",

          headers: {
            "Content-Type": "application/json",
            "apikey": SUPABASE_KEY,
            "Authorization": `Bearer ${SUPABASE_KEY}`,
            "Prefer": "return=representation"
          },

          body: JSON.stringify({
            code: code,
            original_url: originalUrl
          })
        }
      );


    if (!response.ok) {

      const error =
        await response.text();

      console.error(error);

      status.textContent =
        "No se pudo crear el enlace.";

      return;
    }


    const shortUrl =
      `${window.location.origin}${window.location.pathname}${code}`;


    document.getElementById("shortUrl").textContent =
      shortUrl;


    result.style.display =
      "block";


    status.textContent =
      "¡Enlace LC creado correctamente!";


    cargarEnlaces();

  } catch (error) {

    console.error(error);

    status.textContent =
      "Error de conexión con Supabase.";

  }

}


async function cargarEnlaces() {

  const lista =
    document.getElementById("linksList");

  const counter =
    document.getElementById("counter");


  try {

    const response =
      await fetch(
        `${SUPABASE_URL}/rest/v1/Links?select=code,original_url&order=code.asc`,
        {
          method: "GET",

          headers: {
            "apikey": SUPABASE_KEY,
            "Authorization": `Bearer ${SUPABASE_KEY}`
          }
        }
      );


    if (!response.ok) {

      lista.innerHTML =
        `<div class="empty">
          No se pudieron cargar los enlaces.
        </div>`;

      return;
    }


    const enlaces =
      await response.json();


    counter.textContent =
      enlaces.length;


    if (enlaces.length === 0) {

      lista.innerHTML =
        `<div class="empty">
          Todavía no tienes enlaces creados.
        </div>`;

      return;
    }


    lista.innerHTML =
      "";


    enlaces.forEach(enlace => {

      const shortUrl =
        `${window.location.origin}${window.location.pathname}${enlace.code}`;


      const card =
        document.createElement("div");

      card.className =
        "link-card";


      card.innerHTML = `

        <div class="link-name">
          /${escapeHtml(enlace.code)}
        </div>

        <div class="original">
          ${escapeHtml(enlace.original_url)}
        </div>

        <div class="link-url">
          ${escapeHtml(shortUrl)}
        </div>

        <div class="actions">

          <button
            class="open-button"
            onclick="abrirEnlace('${encodeURIComponent(shortUrl)}')">
            🔗 Abrir
          </button>

          <button
            class="copy-button"
            onclick="copiarEnlace('${encodeURIComponent(shortUrl)}')">
            📋 Copiar
          </button>

        </div>

      `;


      lista.appendChild(card);

    });


  } catch (error) {

    console.error(error);

    lista.innerHTML =
      `<div class="empty">
        Error de conexión.
      </div>`;

  }

}


function abrirEnlace(url) {

  const enlace =
    decodeURIComponent(url);

  window.open(
    enlace,
    "_blank"
  );

}


async function copiarEnlace(url) {

  const enlace =
    decodeURIComponent(url);

  try {

    await navigator.clipboard.writeText(
      enlace
    );

    document.getElementById("status").textContent =
      "Enlace copiado.";

  } catch {

    document.getElementById("status").textContent =
      "No se pudo copiar el enlace.";

  }

}


async function copiarResultado() {

  const url =
    document.getElementById("shortUrl").textContent;

  try {

    await navigator.clipboard.writeText(url);

    document.getElementById("status").textContent =
      "Enlace copiado.";

  } catch {

    document.getElementById("status").textContent =
      "No se pudo copiar el enlace.";

  }

}


async function compartirResultado() {

  const url =
    document.getElementById("shortUrl").textContent;


  if (navigator.share) {

    try {

      await navigator.share({
        title: "LC ShortLinks",
        url: url
      });

    } catch (error) {

      console.log(error);

    }

  } else {

    copiarResultado();

  }

}


function escapeHtml(text) {

  const div =
    document.createElement("div");

  div.textContent =
    text;

  return div.innerHTML;

}


cargarEnlaces();

</script>
