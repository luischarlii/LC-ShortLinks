<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111111">
  <title>LC ShortLinks</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 24px 15px;
      font-family: Arial, sans-serif;
      background: #f5f5f7;
      color: #111;
    }

    .container {
      max-width: 650px;
      margin: auto;
    }

    header {
      text-align: center;
      margin-bottom: 25px;
    }

    header h1 { margin-bottom: 6px; }
    header p { color: #666; }

    .card {
      background: white;
      padding: 22px;
      margin-bottom: 18px;
      border-radius: 16px;
      box-shadow: 0 4px 15px rgba(0,0,0,.06);
    }

    h2 {
      font-size: 19px;
      margin-top: 0;
    }

    label {
      display: block;
      font-weight: bold;
      margin: 15px 0 7px;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 9px;
      font-size: 16px;
      background: white;
    }

    button {
      border: 0;
      border-radius: 9px;
      padding: 12px 15px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 12px;
    }

    .main-button {
      width: 100%;
      background: #111;
      color: white;
    }

    .secondary {
      background: #e9e9ee;
      color: #111;
    }

    .danger {
      background: #ffe5e5;
      color: #a00000;
    }

    .hint {
      font-size: 13px;
      color: #666;
      line-height: 1.5;
    }

    .message {
      font-size: 14px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .link-item {
      border: 1px solid #e4e4e8;
      border-radius: 12px;
      padding: 15px;
      margin-top: 13px;
    }

    .short-link {
      display: block;
      color: #075ec7;
      font-weight: bold;
      overflow-wrap: anywhere;
      margin: 10px 0;
    }

    .original-link {
      display: block;
      color: #666;
      font-size: 13px;
      overflow-wrap: anywhere;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
    }

    .actions button {
      margin-top: 8px;
    }

    #appSection { display: none; }

    #qrModal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 10;
      background: rgba(0,0,0,.65);
      padding: 20px;
      align-items: center;
      justify-content: center;
    }

    .modal-content {
      width: 100%;
      max-width: 360px;
      background: white;
      border-radius: 16px;
      padding: 22px;
      text-align: center;
    }

    #qrCode {
      display: flex;
      justify-content: center;
      margin: 20px 0;
      min-height: 20px;
    }

    #qrCode img, #qrCode canvas {
      max-width: 100%;
      height: auto;
    }

    .hidden { display: none !important; }

    footer {
      text-align: center;
      color: #777;
      font-size: 12px;
      padding: 15px;
    }
  </style>
</head>

<body>
<div class="container">

  <header>
    <h1>🔗 LC ShortLinks</h1>
    <p>Enlaces cortos con tu propio nombre</p>
  </header>

  <section id="authSection" class="card">
    <h2>Accede a tu cuenta</h2>

    <form id="loginForm">
      <label for="email">Correo electrónico</label>
      <input id="email" type="email"
        placeholder="tucorreo@ejemplo.com" required>

      <label for="password">Contraseña</label>
      <input id="password" type="password"
        placeholder="Tu contraseña" required>

      <button class="main-button" type="submit">
        Iniciar sesión
      </button>
    </form>

    <button class="secondary" id="registerButton">
      Crear cuenta nueva
    </button>

    <p id="authMessage" class="message" aria-live="polite"></p>
  </section>

  <section id="appSection">

    <div class="card">
      <p id="userInfo" class="hint"></p>

      <button class="secondary" id="logoutButton">
        Cerrar sesión
      </button>
    </div>

    <div class="card">
      <h2>Crear enlace corto</h2>

      <form id="createForm">
        <label for="originalUrl">Enlace original</label>
        <input id="originalUrl" type="url"
          placeholder="https://ejemplo.com/pagina" required>

        <label for="tunombre">Nombre personalizado</label>
        <input id="tunombre" type="text"
          placeholder="mi-oferta"
          maxlength="50"
          pattern="[A-Za-z0-9_-]+"
          title="Usa letras sin acentos, números, guiones o guiones bajos"
          autocomplete="off"
          required>

        <p class="hint">
          Este nombre aparecerá al final de tu enlace corto.
          No uses espacios ni acentos.
        </p>

        <button class="main-button" id="createButton" type="submit">
          Crear enlace corto
        </button>
      </form>

      <p id="createMessage" class="message" aria-live="polite"></p>
    </div>

    <div class="card">
      <h2>Mis enlaces</h2>
      <button class="secondary" id="refreshButton">
        Actualizar lista
      </button>

      <div id="linksList">
        <p class="hint">Cargando enlaces...</p>
      </div>
    </div>

  </section>

  <footer>LC ShortLinks · Luis Charlii</footer>
</div>

<div id="qrModal" role="dialog" aria-modal="true"
  aria-labelledby="qrTitle">
  <div class="modal-content">
    <h2 id="qrTitle">Código QR</h2>
    <div id="qrCode"></div>
    <p id="qrUrl" class="hint"></p>

    <button class="main-button" id="downloadQRButton">
      Descargar QR
    </button>

    <button class="secondary" id="closeQRButton">
      Cerrar
    </button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<script>
"use strict";

// CONFIGURACIÓN DE TU PROYECTO SUPABASE
const SUPABASE_URL =
  "https://tfwepffzhuyppsavmoqw.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_4DOmAEAQ5tQv8U5zGgMHLg_m8u6N06J";

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const authSection = document.getElementById("authSection");
const appSection = document.getElementById("appSection");
const authMessage = document.getElementById("authMessage");
const createMessage = document.getElementById("createMessage");
const linksList = document.getElementById("linksList");

let currentUser = null;
let currentQRUrl = "";

// Construye el enlace con la ruta de GitHub Pages.
function getShortUrl(code) {
  const base = new URL("./", window.location.href);
  return new URL(encodeURIComponent(code), base).href;
}

function showMessage(element, message, isError = false) {
  element.textContent = message;
  element.style.color = isError ? "#b00020" : "#16733b";
}

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, function(char) {
    return {
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#39;"
    }[char];
  });
}

function validDestination(value) {
  try {
    const url = new URL(value);
    return url.protocol === "http:" || url.protocol === "https:";
  } catch {
    return false;
  }
}

// REGISTRO
document.getElementById("registerButton").addEventListener(
  "click", async function() {
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    if (!email || !password) {
      showMessage(
        authMessage,
        "Escribe tu correo y contraseña para crear tu cuenta.",
        true
      );
      return;
    }

    if (password.length < 6) {
      showMessage(
        authMessage,
        "La contraseña debe tener al menos 6 caracteres.",
        true
      );
      return;
    }

    showMessage(authMessage, "Creando cuenta...");

    const { data, error } = await db.auth.signUp({
      email: email,
      password: password
    });

    if (error) {
      showMessage(authMessage, error.message, true);
      return;
    }

    if (data.session) {
      showMessage(authMessage, "Cuenta creada correctamente.");
    } else {
      showMessage(
        authMessage,
        "Cuenta creada. Revisa tu correo para confirmar el registro y después inicia sesión."
      );
    }
  }
);

// INICIAR SESIÓN
document.getElementById("loginForm").addEventListener(
  "submit", async function(event) {
    event.preventDefault();

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    showMessage(authMessage, "Iniciando sesión...");

    const { error } = await db.auth.signInWithPassword({
      email: email,
      password: password
    });

    if (error) {
      showMessage(authMessage, error.message, true);
    }
  }
);

// CERRAR SESIÓN
document.getElementById("logoutButton").addEventListener(
  "click", async function() {
    const { error } = await db.auth.signOut();

    if (error) {
      alert("No se pudo cerrar sesión: " + error.message);
    }
  }
);

// ESTADO DE SESIÓN
db.auth.onAuthStateChange(function(event, session) {
  currentUser = session ? session.user : null;

  if (currentUser) {
    authSection.style.display = "none";
    appSection.style.display = "block";

    document.getElementById("userInfo").textContent =
      "Sesión iniciada: " + currentUser.email;

    if (event !== "INITIAL_SESSION") {
      loadLinks();
    }
  } else {
    authSection.style.display = "block";
    appSection.style.display = "none";
    linksList.innerHTML = "";
  }
});

// CREAR ENLACE PERSONALIZADO
document.getElementById("createForm").addEventListener(
  "submit", async function(event) {
    event.preventDefault();

    if (!currentUser) {
      showMessage(createMessage, "Inicia sesión primero.", true);
      return;
    }

    const originalUrl =
      document.getElementById("originalUrl").value.trim();

    const slugInput =
      document.getElementById("tunombre").value.trim();

    const slug = slugInput.toLowerCase();

    if (!validDestination(originalUrl)) {
      showMessage(
        createMessage,
        "Escribe una dirección válida que empiece con https:// o http://.",
        true
      );
      return;
    }

    if (!/^[a-zA-Z0-9_-]{1,50}$/.test(slugInput)) {
      showMessage(
        createMessage,
        "El nombre solo puede contener letras, números, guiones y guiones bajos.",
        true
      );
      return;
    }

    const button = document.getElementById("createButton");
    button.disabled = true;
    button.textContent = "Creando...";
    showMessage(createMessage, "");

    try {
      /*
       * Guardamos el nombre personalizado en code y codetext.
       * El campo code mantiene compatibilidad con los enlaces
       * que la función resolve_short_link busca por p_code.
       */
      const { error } = await db.from("Links").insert({
        code: slug,
        codetext: slug,
        original_url: originalUrl,
        clicks: 0,
        user_id: currentUser.id
      });

      if (error) {
        console.error("Error al crear enlace:", error);

        if (
          error.code === "23505" ||
          /duplicate|unique/i.test(error.message || "")
        ) {
          showMessage(
            createMessage,
            "Ese nombre ya está ocupado. Prueba con otro.",
            true
          );
        } else {
          showMessage(
            createMessage,
            "No se pudo crear el enlace: " + error.message,
            true
          );
        }

        return;
      }

      document.getElementById("createForm").reset();

      showMessage(
        createMessage,
        "Enlace creado: " + getShortUrl(slug)
      );

      await loadLinks();

    } catch (error) {
      console.error(error);
      showMessage(
        createMessage,
        "Ocurrió un error al crear el enlace.",
        true
      );
    } finally {
      button.disabled = false;
      button.textContent = "Crear enlace corto";
    }
  }
);

// CARGAR ENLACES DEL USUARIO
async function loadLinks() {
  if (!currentUser) return;

  linksList.innerHTML = "<p class='hint'>Cargando enlaces...</p>";

  const { data, error } = await db
    .from("Links")
    .select("*")
    .eq("user_id", currentUser.id)
    .order("code", { ascending: true });

  if (error) {
    console.error(error);
    linksList.innerHTML =
      "<p class='message'>No se pudieron cargar los enlaces: " +
      escapeHTML(error.message) + "</p>";
    return;
  }

  renderLinks(data || []);
}

// MOSTRAR ENLACES
function renderLinks(links) {
  if (!links.length) {
    linksList.innerHTML =
      "<p class='hint'>Todavía no tienes enlaces guardados.</p>";
    return;
  }

  linksList.innerHTML = links.map(function(link) {
    const code = String(link.code || "");
    const shortUrl = getShortUrl(code);
    const originalUrl = String(link.original_url || "");
    const displayName = String(link.codetext || link.code || "");

    return `
      <div class="link-item">
        <strong>${escapeHTML(displayName)}</strong>

        <a class="short-link"
           href="${escapeHTML(shortUrl)}"
           target="_blank"
           rel="noopener noreferrer">
          ${escapeHTML(shortUrl)}
        </a>

        <span class="original-link">
          Destino: ${escapeHTML(originalUrl)}
        </span>

        <p class="hint">
          Clics: ${Number(link.clicks) || 0}
        </p>

        <div class="actions">
          <button class="secondary"
            data-action="copy"
            data-code="${escapeHTML(code)}">
            Copiar
          </button>

          <button class="secondary"
            data-action="qr"
            data-code="${escapeHTML(code)}">
            Crear QR
          </button>

          <button class="danger"
            data-action="delete"
            data-code="${escapeHTML(code)}">
            Eliminar
          </button>
        </div>
      </div>
    `;
  }).join("");
}

// ACCIONES DE CADA ENLACE
linksList.addEventListener("click", async function(event) {
  const button = event.target.closest("button[data-action]");
  if (!button || !currentUser) return;

  const action = button.dataset.action;
  const code = button.dataset.code;
  const shortUrl = getShortUrl(code);

  if (action === "copy") {
    try {
      await navigator.clipboard.writeText(shortUrl);
      alert("Enlace copiado:\n" + shortUrl);
    } catch {
      window.prompt("Copia tu enlace:", shortUrl);
    }
  }

  if (action === "qr") {
    openQR(shortUrl);
  }

  if (action === "delete") {
    const confirmed = confirm(
      "¿Seguro que quieres eliminar este enlace?"
    );

    if (!confirmed) return;

    const { error } = await db
      .from("Links")
      .delete()
      .eq("code", code)
      .eq("user_id", currentUser.id);

    if (error) {
      alert("No se pudo eliminar: " + error.message);
      return;
    }

    await loadLinks();
  }
});

// ACTUALIZAR LISTA
document.getElementById("refreshButton").addEventListener(
  "click", loadLinks
);

// CÓDIGO QR
function openQR(url) {
  currentQRUrl = url;

  document.getElementById("qrUrl").textContent = url;

  const qrContainer = document.getElementById("qrCode");
  qrContainer.innerHTML = "";

  document.getElementById("qrModal").style.display = "flex";

  if (typeof QRCode === "undefined") {
    qrContainer.textContent =
      "No se pudo cargar el generador QR. Revisa tu conexión.";
    return;
  }

  new QRCode(qrContainer, {
    text: url,
    width: 220,
    height: 220,
    correctLevel: QRCode.CorrectLevel.H
  });
}

document.getElementById("closeQRButton").addEventListener(
  "click", function() {
    document.getElementById("qrModal").style.display = "none";
  }
);

document.getElementById("qrModal").addEventListener(
  "click", function(event) {
    if (event.target.id === "qrModal") {
      event.currentTarget.style.display = "none";
    }
  }
);

document.getElementById("downloadQRButton").addEventListener(
  "click", function() {
    const qrContainer = document.getElementById("qrCode");
    const canvas = qrContainer.querySelector("canvas");
    const img = qrContainer.querySelector("img");

    let dataUrl = "";

    if (canvas) {
      dataUrl = canvas.toDataURL("image/png");
    } else if (img) {
      dataUrl = img.src;
    }

    if (!dataUrl) {
      alert("El código QR todavía no está listo.");
      return;
    }

    const link = document.createElement("a");
    link.href = dataUrl;
    link.download = "LC-ShortLinks-QR.png";
    link.click();
  }
);
</script>
</body>
</html>
