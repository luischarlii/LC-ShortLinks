
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LC ShortLinks</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:20px 14px 40px;font-family:Arial,sans-serif;background:#f5f5f7;color:#111}
.container{max-width:600px;margin:auto}
.logo{display:block;width:85px;height:85px;object-fit:contain;margin:10px auto}
h1{text-align:center;font-size:29px;margin:8px 0}
.subtitle{text-align:center;color:#666;margin:0 0 24px}
.card{background:white;border-radius:18px;padding:20px;margin-bottom:20px;box-shadow:0 4px 15px #0000000d}
h2{font-size:21px;margin:0 0 16px}
label{display:block;font-weight:bold;margin:15px 0 8px}
input{display:block;width:100%;padding:14px;border:2px solid #ddd;border-radius:11px;font-size:16px;background:white;color:#111}
button{cursor:pointer;border:0;border-radius:11px;padding:13px;font-size:15px;font-weight:bold}
.main-button{width:100%;background:#111;color:white;margin-top:15px;min-height:48px}
.secondary{background:#e8e8eb;color:#111}
.danger{background:#ffe1e1;color:#a00000}
.hidden{display:none!important}
.message{display:none;padding:12px;margin-top:14px;border-radius:10px;overflow-wrap:anywhere;font-size:14px}
.error{display:block;background:#ffe5e5;color:#a00000}
.success{display:block;background:#e5f8e9;color:#176b2c}
.hint{font-size:13px;color:#777;line-height:1.5}
.link-item{background:#f7f7f8;border-radius:12px;padding:14px;margin:12px 0;overflow-wrap:anywhere}
.link-code{font-size:17px;font-weight:bold;margin-bottom:8px}
.link-original{font-size:13px;color:#666;margin-bottom:8px}
.link-url{color:#0666c2;font-size:14px;margin-bottom:10px}
.clicks{display:inline-block;background:#e9e9ed;padding:7px 10px;border-radius:8px;font-size:13px;margin:0 0 12px}
.actions{display:flex;flex-wrap:wrap;gap:7px}
.actions button{flex:1;min-width:75px}
.topline{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.topline h2{margin:0}
#counter{font-size:14px;color:#777;margin-bottom:12px}
.empty{text-align:center;color:#777;padding:20px 5px}
</style>
</head>
<body>
<div class="container">
  <img src="./IMG_8655.png" class="logo" alt="LC">
  <h1>LC ShortLinks</h1>
  <p class="subtitle">Tus enlaces, bajo tu control</p>

  <section class="card" id="loginCard">
    <h2>Iniciar sesión</h2>
    <p class="hint">Entra con el correo y la contraseña de tu cuenta existente.</p>
    <form id="loginForm">
      <label for="email">Correo electrónico</label>
      <input id="email" type="email" autocomplete="username" required>
      <label for="password">Contraseña</label>
      <input id="password" type="password" autocomplete="current-password" required>
      <button class="main-button" type="submit" id="loginButton">Entrar</button>
    </form>
    <div id="loginMessage" class="message"></div>
  </section>

  <div id="privateApp" class="hidden">
    <section class="card">
      <div class="topline">
        <h2>Mi cuenta</h2>
        <button class="secondary" id="logoutButton">Cerrar sesión</button>
      </div>
      <p class="hint" id="accountEmail"></p>
    </section>

    <section class="card">
      <h2>Crear enlace</h2>
      <form id="createForm">
        <label for="originalUrl">🔗 Enlace original</label>
        <input id="originalUrl" type="url" placeholder="https://ejemplo.com" required autocomplete="url">
        <label for="customCode">✏️ Nombre de tu acortación</label>
        <input id="customCode" type="text" placeholder="tunombre" required maxlength="100" autocapitalize="none" autocomplete="off">
        <p class="hint">Usa letras, números, guiones o guiones bajos.</p>
        <button class="main-button" type="submit" id="createButton">Crear enlace LC</button>
      </form>
      <div id="appMessage" class="message"></div>
      <div id="result" class="hidden">
        <p><strong>Tu enlace está listo:</strong></p>
        <p><a id="resultLink" href="#" target="_blank" rel="noopener"></a></p>
        <div class="actions">
          <button class="secondary" id="copyResult">📋 Copiar</button>
          <button class="secondary" id="shareResult">📤 Compartir</button>
        </div>
      </div>
    </section>

    <section class="card">
      <h2>Mis enlaces</h2>
      <div id="counter">Cargando...</div>
      <div id="linksList"></div>
    </section>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://tfwepffzhuyppsavmoqw.supabase.co";
const SUPABASE_KEY = "sb_publishable_4DOmAEAQ5tQv8U5zGgMHLg_m8u6N06J";
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const $ = id => document.getElementById(id);
let currentUser = null;
let linksCache = [];

function showMessage(id, text, type) {
  const el = $(id);
  el.textContent = text;
  el.className = "message " + type;
}
function clearMessage(id) {
  $(id).textContent = "";
  $(id).className = "message";
}
function escapeHtml(value) {
  return String(value).replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  }[c]));
}
function shortUrl(code) {
  return location.origin + location.pathname + encodeURIComponent(code);
}
function setSignedIn(user) {
  currentUser = user;
  $("loginCard").classList.toggle("hidden", !!user);
  $("privateApp").classList.toggle("hidden", !user);
  $("accountEmail").textContent = user ? user.email : "";
  if (!user) {
    $("linksList").replaceChildren();
    $("counter").textContent = "";
    linksCache = [];
  }
}
async function loadLinks() {
  if (!currentUser) return;
  $("counter").textContent = "Cargando enlaces...";
  const {data, error} = await db
    .from("Links")
    .select("code,original_url,clicks")
    .eq("user_id", currentUser.id)
    .order("code", {ascending:true});

  if (error) {
    $("counter").textContent = "No se pudieron cargar los enlaces.";
    console.error(error);
    return;
  }

  linksCache = data || [];
  $("counter").textContent =
    `${linksCache.length} enlace${linksCache.length === 1 ? "" : "s"}`;

  const list = $("linksList");
  list.replaceChildren();

  if (!linksCache.length) {
    list.innerHTML = '<div class="empty">Todavía no tienes enlaces creados.</div>';
    return;
  }

  linksCache.forEach(link => {
    const item = document.createElement("div");
    item.className = "link-item";
    const destination = shortUrl(link.code);
    item.innerHTML = `
      <div class="link-code">🔗 ${escapeHtml(link.code)}</div>
      <div class="link-original">${escapeHtml(link.original_url)}</div>
      <div class="link-url">${escapeHtml(destination)}</div>
      <div class="clicks">📊 ${Number(link.clicks) || 0} clic${Number(link.clicks) === 1 ? "" : "s"}</div>
      <div class="actions">
        <button class="secondary open-btn">Abrir</button>
        <button class="secondary copy-btn">Copiar</button>
        <button class="danger delete-btn">Borrar</button>
      </div>`;
    item.querySelector(".open-btn").addEventListener("click", () => {
      window.open(destination, "_blank", "noopener");
    });
    item.querySelector(".copy-btn").addEventListener("click", () => copyText(destination));
    item.querySelector(".delete-btn").addEventListener("click", () => deleteLink(link.code));
    list.appendChild(item);
  });
}
async function copyText(value) {
  try {
    await navigator.clipboard.writeText(value);
    showMessage("appMessage", "Enlace copiado.", "success");
  } catch {
    showMessage("appMessage", "No se pudo copiar automáticamente.", "error");
  }
}

$("loginForm").addEventListener("submit", async event => {
  event.preventDefault();
  clearMessage("loginMessage");
  $("loginButton").disabled = true;
  $("loginButton").textContent = "Entrando...";
  try {
    const {data, error} = await db.auth.signInWithPassword({
      email: $("email").value.trim(),
      password: $("password").value
    });
    if (error) throw error;
    setSignedIn(data.user);
    $("password").value = "";
    await loadLinks();
  } catch (error) {
    showMessage("loginMessage", "No se pudo iniciar sesión: " + error.message, "error");
  } finally {
    $("loginButton").disabled = false;
    $("loginButton").textContent = "Entrar";
  }
});

$("logoutButton").addEventListener("click", async () => {
  const {error} = await db.auth.signOut();
  if (error) {
    showMessage("appMessage", "No se pudo cerrar sesión: " + error.message, "error");
  } else {
    setSignedIn(null);
    clearMessage("loginMessage");
  }
});

$("createForm").addEventListener("submit", async event => {
  event.preventDefault();
  clearMessage("appMessage");
  $("result").classList.add("hidden");

  if (!currentUser) {
    showMessage("appMessage", "Inicia sesión primero.", "error");
    return;
  }

  const url = $("originalUrl").value.trim();
  const code = $("customCode").value.trim();

  try {
    const parsed = new URL(url);
    if (!["http:", "https:"].includes(parsed.protocol)) throw new Error("Usa una dirección que empiece con https:// o http://.");
  } catch {
    showMessage("appMessage", "Escribe una dirección web válida que empiece con https:// o http://.", "error");
    return;
  }

  if (!/^[a-zA-Z0-9_-]+$/.test(code)) {
    showMessage("appMessage", "El nombre solo puede contener letras, números, guiones y guiones bajos.", "error");
    return;
  }

  $("createButton").disabled = true;
  $("createButton").textContent = "Guardando...";
  try {
    const {data: existing, error: checkError} = await db
      .from("Links").select("code").eq("code", code).maybeSingle();

    if (checkError) throw checkError;
    if (existing) {
      showMessage("appMessage", `El nombre "${code}" ya está ocupado. Elige otro.`, "error");
      return;
    }

    const {error} = await db.from("Links").insert({
      code,
      original_url: url,
      clicks: 0,
      user_id: currentUser.id
    });

    if (error) throw error;

    const destination = shortUrl(code);
    $("resultLink").href = destination;
    $("resultLink").textContent = destination;
    $("result").classList.remove("hidden");
    $("originalUrl").value = "";
    $("customCode").value = "";
    showMessage("appMessage", "¡Enlace creado correctamente!", "success");
    await loadLinks();
  } catch (error) {
    console.error(error);
    showMessage("appMessage", "Error al guardar: " + error.message, "error");
  } finally {
    $("createButton").disabled = false;
    $("createButton").textContent = "Crear enlace LC";
  }
});

$("copyResult").addEventListener("click", () => copyText($("resultLink").textContent));
$("shareResult").addEventListener("click", async () => {
  const url = $("resultLink").textContent;
  if (navigator.share) {
    try {
      await navigator.share({title:"LC ShortLinks", text:"Mira este enlace:", url});
    } catch (error) {
      if (error.name !== "AbortError") console.error(error);
    }
  } else {
    await copyText(url);
  }
});

async function deleteLink(code) {
  if (!currentUser || !confirm(`¿Seguro que quieres borrar "${code}"?`)) return;
  const {error} = await db.from("Links")
    .delete()
    .eq("code", code)
    .eq("user_id", currentUser.id);

  if (error) {
    showMessage("appMessage", "No se pudo borrar: " + error.message, "error");
    return;
  }
  showMessage("appMessage", "Enlace borrado correctamente.", "success");
  await loadLinks();
}

db.auth.onAuthStateChange((event, session) => {
  setSignedIn(session ? session.user : null);
  if (session) {
    setTimeout(() => loadLinks(), 0);
  }
});

(async function init() {
  const {data, error} = await db.auth.getSession();
  if (error) {
    showMessage("loginMessage", "No se pudo comprobar la sesión: " + error.message, "error");
    return;
  }
  setSignedIn(data.session ? data.session.user : null);
  if (data.session) await loadLinks();
})();
</script>
</body>
</html>
