<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LC ShortLinks</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f5f7;
      color: #111;
      text-align: center;
    }

    .box {
      padding: 30px;
    }

    .logo {
      width: 70px;
      height: 70px;
      margin: 0 auto 20px;
      border-radius: 18px;
      background: #111;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: 800;
    }

    p {
      color: #777;
    }
  </style>
</head>

<body>

<div class="box">

  <div class="logo">LC</div>

  <h2>Abriendo enlace...</h2>

  <p id="status">
    Espera un momento.
  </p>

</div>

<script>

const SUPABASE_URL =
"https://tfwepffzhuyppsavmoqw.supabase.co";

const SUPABASE_KEY =
"sb_publishable_4DOmAEAQ5tQv8U5zGgMHLg_m8u6N06J";


async function redireccionar() {

  const params =
    new URLSearchParams(window.location.search);

  const code =
    params.get("l");

  if (!code) {

    document.getElementById("status").textContent =
      "Enlace no válido.";

    return;
  }

  try {

    const response = await fetch(
      `${SUPABASE_URL}/rest/v1/Links?code=eq.${encodeURIComponent(code)}&select=original_url&limit=1`,
      {
        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization": `Bearer ${SUPABASE_KEY}`
        }
      }
    );

    if (!response.ok) {
      throw new Error("Error de Supabase");
    }

    const data = await response.json();

    if (!data.length) {

      document.getElementById("status").textContent =
        "El enlace no existe.";

      return;
    }

    const destino =
      data[0].original_url;

    window.location.replace(destino);

  } catch (error) {

    console.error(error);

    document.getElementById("status").textContent =
      "No se pudo abrir el enlace.";

  }

}

redireccionar();

</script>

</body>
</html>
