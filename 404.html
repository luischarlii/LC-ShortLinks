
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LC ShortLinks</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      margin: 0;
      padding: 40px 20px;
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f5f5f7;
      color: #111;
    }
    .box {
      max-width: 500px;
      margin: 60px auto;
      background: white;
      padding: 30px;
      border-radius: 18px;
      box-shadow: 0 4px 15px rgba(0,0,0,.08);
    }
    p { color: #666; line-height: 1.5; }
  </style>
</head>
<body>
  <div class="box">
    <h1>🔗 LC ShortLinks</h1>
    <p id="message">Redirigiendo...</p>
  </div>

<script>
const SUPABASE_URL = "https://tfwepffzhuyppsavmoqw.supabase.co";
const SUPABASE_KEY = "sb_publishable_4DOmAEAQ5tQv8U5zGgMHLg_m8u6N06J";

const base = "/LC-ShortLinks/";
const path = window.location.pathname;
let code = path.startsWith(base) ? path.substring(base.length) : "";
code = decodeURIComponent(code).replace(/^\/+|\/+$/g, "");

function showError(text) {
  document.getElementById("message").textContent = text;
}

async function redirectLink() {
  if (!code || code === "404.html") {
    showError("No se encontró el enlace.");
    return;
  }

  try {
    const response = await fetch(
      `${SUPABASE_URL}/rest/v1/rpc/resolve_short_link`,
      {
        method: "POST",
        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization": `Bearer ${SUPABASE_KEY}`,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ p_code: code })
      }
    );

    if (!response.ok) {
      throw new Error("La función de redirección respondió con error.");
    }

    const url = await response.json();

    if (typeof url !== "string" || !url.trim()) {
      showError("Enlace no encontrado.");
      return;
    }

    let destination;
    try {
      destination = new URL(url);
    } catch {
      showError("El destino del enlace no es válido.");
      return;
    }

    if (!["http:", "https:"].includes(destination.protocol)) {
      showError("El destino del enlace no es válido.");
      return;
    }

    window.location.replace(destination.href);
  } catch (error) {
    console.error(error);
    showError("No se pudo procesar el enlace. Intenta de nuevo.");
  }
}

redirectLink();
</script>
</body>
</html>
