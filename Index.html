<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="theme-color" content="#111111">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <title>LC ShortLinks</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f5f7;
      color: #111;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .app {
      width: 100%;
      max-width: 500px;
      background: white;
      border-radius: 28px;
      padding: 30px 22px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.10);
    }

    .logo {
      width: 80px;
      height: 80px;
      border-radius: 20px;
      background: #111;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      font-weight: 800;
      margin: 0 auto 18px;
    }

    h1 {
      text-align: center;
      margin: 0;
      font-size: 30px;
    }

    .subtitle {
      text-align: center;
      color: #777;
      margin: 8px 0 28px;
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      padding: 16px;
      border: 1px solid #ddd;
      border-radius: 14px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #111;
    }

    button {
      width: 100%;
      margin-top: 14px;
      padding: 16px;
      border: 0;
      border-radius: 14px;
      background: #111;
      color: white;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.98);
    }

    .result {
      display: none;
      margin-top: 24px;
      padding: 18px;
      background: #f5f5f7;
      border-radius: 16px;
    }

    .result-title {
      font-weight: 700;
      margin-bottom: 8px;
    }

    .short-url {
      word-break: break-all;
      font-weight: 600;
      margin-bottom: 12px;
    }

    .copy {
      background: white;
      color: #111;
      border: 1px solid #ddd;
    }

    .status {
      text-align: center;
      margin-top: 15px;
      color: #777;
      font-size: 14px;
      min-height: 20px;
    }
  </style>
</head>

<body>

  <main class="app">

    <div class="logo">LC</div>

    <h1>LC ShortLinks</h1>

    <p class="subtitle">
      Acorta y comparte tus enlaces
    </p>

    <label for="url">Enlace original</label>

    <input
      id="url"
      type="url"
      placeholder="https://ejemplo.com/una-direccion-muy-larga"
      autocomplete="off"
    >

    <button onclick="acortar()">
      Acortar enlace
    </button>

    <div id="result" class="result">

      <div class="result-title">
        Tu enlace corto
      </div>

      <div id="shortUrl" class="short-url"></div>

      <button class="copy" onclick="copiar()">
        Copiar enlace
      </button>

      <button class="copy" onclick="compartir()">
        Compartir
      </button>

    </div>

    <div id="status" class="status"></div>

  </main>

  <script>

    function acortar() {

      const url = document.getElementById("url").value.trim();
      const status = document.getElementById("status");

      if (!url) {
        status.textContent = "Pega primero un enlace.";
        return;
      }

      try {
        new URL(url);
      } catch {
        status.textContent = "El enlace no parece válido.";
        return;
      }

      status.textContent =
        "La conexión con el servidor se configurará en el siguiente paso.";

    }

    function copiar() {

      const texto =
        document.getElementById("shortUrl").textContent;

      navigator.clipboard.writeText(texto);

      document.getElementById("status").textContent =
        "Enlace copiado.";

    }

    async function compartir() {

      const texto =
        document.getElementById("shortUrl").textContent;

      if (navigator.share) {

        await navigator.share({
          title: "LC ShortLinks",
          url: texto
        });

      } else {

        copiar();

      }

    }

  </script>

</body>
</html>
